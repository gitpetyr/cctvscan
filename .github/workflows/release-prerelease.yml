name: Build & Publish Pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install libpcap development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcap-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Generate timestamp version
        id: version
        run: |
          TS=$(TZ='Asia/Shanghai' date +'%Y.%m.%d-%H%M%S')
          TAG="v${TS}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S CST')" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          BINARY_NAME="cctvscan"
          PKG_PATH="./cmd/cctvscan"
          VERSION="${{ steps.version.outputs.tag }}"

          # 启用 cgo 链接 libpcap 时，当前 Runner 默认构建 Linux amd64
          TARGETS=(
            "linux/amd64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            OUT_BIN="dist/${BINARY_NAME}-${GOOS}-${GOARCH}${EXT}"
            echo "Building ${OUT_BIN}..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "$OUT_BIN" \
              "$PKG_PATH"

            STAGE_DIR="dist/stage_${GOOS}_${GOARCH}"
            mkdir -p "$STAGE_DIR"
            cp "$OUT_BIN" "$STAGE_DIR/${BINARY_NAME}${EXT}"
            [ -f README.md ] && cp README.md "$STAGE_DIR/"
            [ -f LICENSE ] && cp LICENSE "$STAGE_DIR/"

            ARCHIVE_BASE="${BINARY_NAME}_${VERSION}_${GOOS}_${GOARCH}"
            tar -czf "dist/${ARCHIVE_BASE}.tar.gz" -C "$STAGE_DIR" .
            rm -rf "$STAGE_DIR" "$OUT_BIN"
          done

          (cd dist && sha256sum * > checksums.txt)

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "cctvscan ${{ steps.version.outputs.tag }} (Pre-release)"
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt